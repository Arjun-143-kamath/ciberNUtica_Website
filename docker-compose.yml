services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cibernutica
      POSTGRES_USER: cibernutica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cibernutica-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cibernutica -d cibernutica"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cibernutica-postgres:
